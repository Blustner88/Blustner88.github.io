function formatLastCooked(dateStr) {
  if (!dateStr) return null;
  const days = Math.floor((Date.now() - new Date(dateStr).getTime()) / 86400000);
  if (days <= 0) return "Zuletzt gekocht: heute";
  if (days === 1) return "Zuletzt gekocht: gestern";
  if (days < 7) return `Zuletzt gekocht: vor ${days} Tagen`;

function parseMinutesFromText(text) {
  const hourMatch = text.match(/(\d+)\s*(Stunden|Std\.?|h\b)/i);
  const minMatch = text.match(/(\d+)\s*(Minuten|Min\.?)/i);
  let total = 0;
  if (hourMatch) total += parseInt(hourMatch[1]) * 60;
  if (minMatch) total += parseInt(minMatch[1]);
  return total > 0 ? total : null;
}
function escapeRegExp(s) {
  return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");

function textMentionsIngredient(text, ingredientName) {
  // Wortgrenzen-Suche statt reiner Teilstring-Suche, damit z.B. "Ei" nicht in "Teig" anschlaegt
  const escaped = escapeRegExp(ingredientName.trim());
  const re = new RegExp(`(^|[^a-zA-ZäöüÄÖÜß])${escaped}([^a-zA-ZäöüÄÖÜß]|$)`, "i");
  return re.test(text);

function extractInlineAmount(text, ingredientName) {
  // Versucht, eine im Schritt-Text selbst genannte Menge zu finden (z.B. "50 g Zucker" im Satz),
  // statt vorschnell die komplette Rezeptmenge zu unterstellen -- wichtig bei Zutaten, die auf
  // mehrere Schritte aufgeteilt werden (z.B. Zucker im Teig UND im Belag).
  const escaped = escapeRegExp(ingredientName.trim());
  const re = new RegExp(`(\\d+[.,]?\\d*)\\s*(g|kg|ml|l|EL|TL|Stück|St\\.)?\\s{0,3}(?:${escaped})`, "i");
  const m = text.match(re);
  if (m) return { amount: m[1].replace(",", "."), unit: m[2] || "" };
  return null;
}

function el(tag, attrs = {}, children = []) {

  for (const [k, v] of Object.entries(attrs)) {

    if (k === "html") e.innerHTML = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);

// ============ KI-Rezept-Import ============
function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(",")[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function callImportFunction(payload) {
  const existing_ingredients = state.ingredients.map((i) => ({ name: i.name, category: i.category }));
  const res = await fetch(IMPORT_FUNCTION_URL, {
    method: "POST",
    headers: {
      apikey: SUPABASE_ANON_KEY,
      Authorization: "Bearer " + state.session.access_token,
      "Content-Type": "application/json",
    },
    body: JSON.stringify({ ...payload, existing_ingredients }),
  });
  const data = await res.json();
  if (!res.ok || data.error) throw new Error(data.error || "Unbekannter Fehler beim Import.");
  return data;
}

// Erkannte Zutaten gegen die Stammdatenliste abgleichen; unbekannte automatisch neu anlegen
async function resolveImportedIngredients(ingredientsFromAI) {
  const items = [];
  for (const ing of ingredientsFromAI) {
    const nameLower = (ing.name || "").trim().toLowerCase();
    if (!nameLower) continue;
    // NUR exakte Übereinstimmung (Groß/Kleinschreibung ignoriert) -- keine Teilstring-Suche mehr,
    // da diese z.B. "Olivenöl" faelschlich mit "Öl" zusammengelegt hat.
    let match = state.ingredients.find((i) => i.name.toLowerCase() === nameLower);
    if (!match) {
      // Kategorie kommt jetzt bevorzugt direkt von der KI (praeziser als reine Stichwort-Erkennung)
      const category = CATEGORY_ORDER.includes(ing.category) ? ing.category : (guessCategory(ing.name) || CATEGORY_ORDER[CATEGORY_ORDER.length - 1]);
      const created = await sb("ingredients", {
        method: "POST",
        body: { household_id: HOUSEHOLD_ID, name: ing.name.trim(), category, unit: ing.unit || "g", is_favorite: false },
      });
      match = created[0];
      state.ingredients.push(match);
      state.ingredients.sort((a, b) => a.name.localeCompare(b.name));
    }
    items.push({ ingredient_id: match.id, amount: ing.amount || 100 });
  }
  return items;
}

async function handleImportResult(result) {
  const items = await resolveImportedIngredients(result.ingredients || []);
  state.newRecipeDraft = {
    title: result.title || "Importiertes Rezept",
    servings: result.servings || 4,
    prep_time_minutes: result.prep_time_minutes || "",
    tags: (result.tags || []).join(", "),
    instructions: result.instructions || "",
    image_url: null,
    source_type: "screenshot",
    items,
  };
  state.editingRecipeId = null;
  state.showImportRecipe = false;
  state.importLoading = false;
  state.importError = null;
  state.showAddRecipe = true;
  render();
}

// ============ Supabase REST Helper ============
async function refreshSession() {
  if (!state.session || !state.session.refresh_token) throw new Error("Keine Sitzung zum Erneuern vorhanden.");
  const res = await fetch(SUPABASE_URL + "/auth/v1/token?grant_type=refresh_token", {
    method: "POST",
    headers: { apikey: SUPABASE_ANON_KEY, "Content-Type": "application/json" },
    body: JSON.stringify({ refresh_token: state.session.refresh_token }),
  });
  const data = await res.json();
  if (!res.ok || !data.access_token) throw new Error("Sitzung konnte nicht erneuert werden.");
  state.session = { access_token: data.access_token, refresh_token: data.refresh_token, user: data.user || state.session.user };
  return state.session;
}

async function sb(path, { method = "GET", body, auth = true, _retried = false } = {}) {
  const headers = { apikey: SUPABASE_ANON_KEY, "Content-Type": "application/json" };
  if (auth && state.session) headers.Authorization = "Bearer " + state.session.access_token;
  else headers.Authorization = "Bearer " + SUPABASE_ANON_KEY;
  if (method !== "GET") headers.Prefer = "return=representation";
  const res = await fetch(SUPABASE_URL + "/rest/v1/" + path, { method, headers, body: body ? JSON.stringify(body) : undefined });
  if (!res.ok) {
    const t = await res.text();
    const isExpired = res.status === 401 || t.includes("JWT expired") || t.includes("PGRST303") || t.includes("invalid JWT");
    if (isExpired && auth && state.session && !_retried) {
      try {
        await refreshSession();
        return await sb(path, { method, body, auth, _retried: true });
      } catch (refreshErr) {
        state.session = null;
        render();
        throw new Error("Deine Sitzung ist abgelaufen. Bitte melde dich erneut an.");
      }
    }
    throw new Error(t || res.statusText);
  }
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}
async function authRequest(path, body) {
  const res = await fetch(SUPABASE_URL + "/auth/v1/" + path, {
    method: "POST",
    headers: { apikey: SUPABASE_ANON_KEY, "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error_description || data.msg || data.error || "Fehler");
  return data;
}

// ============ Daten laden ============
function sleep(ms) { return new Promise((resolve) => setTimeout(resolve, ms)); }

async function ensureHousehold() {
  const userId = state.session.user && state.session.user.id;
  if (!userId) throw new Error("Keine gültige Nutzer-ID nach dem Login erhalten.");
  let rows = await sb(`household_members?household_id=eq.${HOUSEHOLD_ID}&user_id=eq.${userId}&select=household_id`);
  if (rows.length) return;

  // Direkt nach einer Registrierung/Anmeldung kann es einen kurzen Moment dauern, bis der
  // Login-Kontext bei der Datenbank vollständig "ankommt" -- daher mit kurzen Pausen mehrfach
  // versuchen, statt sofort einen Fehler zu zeigen.
  let lastError = null;
  for (let attempt = 1; attempt <= 4; attempt++) {
    try {
      await sb("household_members", { method: "POST", body: { household_id: HOUSEHOLD_ID, user_id: userId } });
      rows = await sb(`household_members?household_id=eq.${HOUSEHOLD_ID}&user_id=eq.${userId}&select=household_id`);
      if (rows.length) return;
    } catch (e) {
      lastError = e;
    }
    await sleep(800 * attempt);
  }
  throw new Error("Konnte den Haushalt nicht automatisch verknüpfen. Bitte versuch es in ein paar Sekunden erneut (App neu laden). " + (lastError ? "Technisches Detail: " + lastError.message : ""));
}
function mondayOf(date) {
  const d = new Date(date);
  const day = d.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  d.setDate(d.getDate() + diff);
  return d.toISOString().slice(0, 10);
}
async function ensureWeekPlan() {
  const weekStart = mondayOf(new Date());
  let rows = await sb(`week_plans?household_id=eq.${HOUSEHOLD_ID}&week_start_date=eq.${weekStart}&select=id`);
  let planId;
  if (rows.length) planId = rows[0].id;
  else {
    const created = await sb("week_plans", { method: "POST", body: { household_id: HOUSEHOLD_ID, week_start_date: weekStart } });
    planId = created[0].id;
  }
  state.weekPlanId = planId;
  const entries = await sb(`week_plan_entries?week_plan_id=eq.${planId}&select=id,day,recipe_id,servings_override`);
  state.weekEntries = entries;

  let listRows = await sb(`shopping_lists?week_plan_id=eq.${planId}&select=id`);
  let listId;
  if (listRows.length) listId = listRows[0].id;
  else {
    const created = await sb("shopping_lists", { method: "POST", body: { week_plan_id: planId, household_id: HOUSEHOLD_ID } });
    listId = created[0].id;
  }
  state.shoppingListId = listId;
  const items = await sb(`shopping_list_items?shopping_list_id=eq.${listId}&ingredient_id=is.null&select=id,custom_name,category,is_checked`);
  state.manualItems = items;
}
async function loadIngredients() {
  state.ingredients = await sb(`ingredients?household_id=eq.${HOUSEHOLD_ID}&select=*&order=name.asc`);
}
async function loadStores() {
  state.stores = await sb(`stores?household_id=eq.${HOUSEHOLD_ID}&select=*&order=name.asc`);
  if (state.stores.length && !state.stores.find((s) => s.name === state.store)) state.store = state.stores[0].name;
}
async function loadPantry() {
  const rows = await sb(`pantry_items?household_id=eq.${HOUSEHOLD_ID}&select=ingredient_id`);
  state.pantryIngredientIds = new Set(rows.map((r) => r.ingredient_id));
}
async function loadRecipes() {
  const recipes = await sb(`recipes?household_id=eq.${HOUSEHOLD_ID}&select=*,recipe_ingredients(id,amount,unit,ingredient_id,ingredients(name,category))&order=created_at.desc`);
  state.recipes = recipes.map((r) => ({
    ...r,
    ingredientRows: r.recipe_ingredients.map((ri) => ({
      id: ri.id, amount: ri.amount, unit: ri.unit, ingredient_id: ri.ingredient_id,
      name: ri.ingredients?.name, category: ri.ingredients?.category,
    })),
  }));
}
async function loadAll() {
  state.loading = true; render();
  try {
    await ensureHousehold();
    await Promise.all([loadIngredients(), loadRecipes(), loadStores(), loadPantry()]);
    await ensureWeekPlan();
  } catch (e) { console.error(e); alert(e.message || "Fehler beim Laden. Bitte lade die Seite neu."); }
  state.loading = false; render();
  processSharedUrlIfAny();
}

// ============ Über "Teilen" empfangene Rezept-Links verarbeiten ============
function extractSharedUrl() {
  const params = new URLSearchParams(window.location.search);
  let url = params.get("shared_url") || "";
  const text = params.get("shared_text") || "";
  if (!url && text) {
    const match = text.match(/https?:\/\/\S+/);
    if (match) url = match[0];
  }
  if (params.has("shared_url") || params.has("shared_text") || params.has("shared_title")) {
    window.history.replaceState({}, "", window.location.pathname);
  }
  return url || null;
}

async function processSharedUrlIfAny() {
  if (!state.pendingSharedUrl || !state.session) return;
  const url = state.pendingSharedUrl;
  state.pendingSharedUrl = null;
  state.showImportRecipe = true;
  state.importLoading = true;
  state.importError = null;
  render();
  try {
    const result = await callImportFunction({ type: "url", url });
    await handleImportResult(result);
  } catch (err) {
    state.importLoading = false;
    state.importError = err.message;
    render();
  }
}

      .map((x) => x.r);
  }

  const grid = el("div", { class: "recipe-grid" });
  filtered.forEach((r) => {
    const matchedNames = leftoverTerms.length
      ? [...new Set(r.ingredientRows.filter((ing) => leftoverTerms.some((term) => ing.name.toLowerCase().includes(term))).map((ing) => ing.name))]
      : [];
    grid.appendChild(el("button", { class: "recipe-card", onclick: () => { state.openRecipeId = r.id; render(); } }, [
      r.image_url ? el("div", { class: "thumb", style: "padding:0;" }, el("img", { src: r.image_url, style: "width:100%; height:100%; object-fit:cover; display:block;" })) : el("div", { class: "thumb" }, emojiForTitle(r.title)),
      el("div", { class: "body" }, [
        el("div", { class: "title" }, r.title),
        matchedNames.length ? el("div", { style: "font-size:10.5px; color:var(--accent); font-weight:600; margin-bottom:6px;" }, "✓ " + matchedNames.join(", ")) : null,
        r.last_cooked_at ? el("div", { style: "font-size:10.5px; color:var(--ink-muted); margin-bottom:6px;" }, formatLastCooked(r.last_cooked_at)) : null,
        el("div", { class: "meta" }, [
          el("span", {}, [icon("clock"), el("span", { style: "margin-left:4px;" }, (r.prep_time_minutes || "?") + " min")]),
          el("span", {}, [icon("users"), el("span", { style: "margin-left:4px;" }, String(r.servings || "-"))]),
        ]),
      ]),
      r.rating ? el("div", { style: "position:absolute; top:8px; right:8px; background:rgba(255,255,255,0.92); border-radius:999px; width:24px; height:24px; display:flex; align-items:center; justify-content:center; color:" + (r.rating === "up" ? "var(--accent)" : "var(--danger)") + "; box-shadow:0 1px 3px rgba(20,20,30,0.12);" }, icon(r.rating === "up" ? "thumbsUp" : "thumbsDown")) : null,
    ]));
  });
  if (!filtered.length) grid.appendChild(el("div", { style: "grid-column:1/-1; color:var(--ink-soft); font-size:14px; padding:24px 4px;" }, state.recipes.length ? "Kein Rezept gefunden." : "Noch keine Rezepte — leg das erste an!"));
  wrap.appendChild(grid);

  const stats = computeStats();
  if (stats.mostCooked || stats.longestAgo || stats.weekCount > 0) {
    wrap.appendChild(el("div", { class: "section-label", style: "margin-top:28px;" }, "Kurz zusammengefasst"));
    const statsCard = el("div", { class: "card" });
    if (stats.mostCooked) statsCard.appendChild(el("div", { class: "list-item" }, [
      el("span", { style: "font-size:17px;" }, "🏆"),
      el("div", { style: "flex:1; margin-left:10px;" }, [
        el("div", { style: "font-size:13.5px; font-weight:600;" }, stats.mostCooked.title),
        el("div", { style: "font-size:11.5px; color:var(--ink-muted);" }, `Meistgekocht — ${stats.mostCooked.times_cooked}× gekocht`),
      ]),
    ]));
    if (stats.longestAgo) statsCard.appendChild(el("div", { class: "list-item" }, [
      el("span", { style: "font-size:17px;" }, "⏳"),
      el("div", { style: "flex:1; margin-left:10px;" }, [
        el("div", { style: "font-size:13.5px; font-weight:600;" }, stats.longestAgo.title),
        el("div", { style: "font-size:11.5px; color:var(--ink-muted);" }, "Am längsten nicht gekocht — " + formatLastCooked(stats.longestAgo.last_cooked_at)),
      ]),
    ]));
    statsCard.appendChild(el("div", { class: "list-item" }, [
      el("span", { style: "font-size:17px;" }, "🔥"),
      el("div", { style: "flex:1; margin-left:10px;" }, [
        el("div", { style: "font-size:13.5px; font-weight:600;" }, stats.weekCount + (stats.weekCount === 1 ? " Rezept" : " Rezepte")),
        el("div", { style: "font-size:11.5px; color:var(--ink-muted);" }, "In den letzten 7 Tagen gekocht"),
      ]),
    ]));
    wrap.appendChild(statsCard);
  }

  return wrap;
}

async function uploadRecipePhoto(file) {
  const safeName = file.name.replace(/[^a-zA-Z0-9.]/g, "_");
  const path = `${state.session.user.id}/${Date.now()}-${safeName}`;
  const res = await fetch(`${SUPABASE_URL}/storage/v1/object/recipe-photos/${path}`, {
    method: "POST",
    headers: { apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + state.session.access_token, "Content-Type": file.type || "application/octet-stream" },
    body: file,
  });
  if (!res.ok) throw new Error(await res.text());
  return `${SUPABASE_URL}/storage/v1/object/public/recipe-photos/${path}`;
}

  }, "+ Zutat hinzufügen"));

    type: "button", class: "btn-primary",
    onclick: async () => {
      if (!d.title.trim()) { alert("Bitte einen Titel eingeben."); return; }
      try {
        const payload = {
          household_id: HOUSEHOLD_ID, title: d.title.trim(),
          servings: Number(d.servings) || 4, prep_time_minutes: Number(d.prep_time_minutes) || null,
          tags: d.tags.split(",").map((t) => t.trim()).filter(Boolean),
          instructions: d.instructions || null,

          source_type: d.source_type || "manuell",

        let recipeId;
        if (isEditing) {

          await sb(`recipe_ingredients?recipe_id=eq.${recipeId}`, { method: "DELETE" });
        } else {
          const created = await sb("recipes", { method: "POST", body: payload });
          recipeId = created[0].id;
        }
        for (const it of d.items) {
          if (!it.ingredient_id || !it.amount) continue;
          const ing = state.ingredients.find((i) => i.id === it.ingredient_id);

        }
        state.showAddRecipe = false;
        state.editingRecipeId = null;
        await loadRecipes();
        render();
      } catch (e) { alert("Fehler beim Speichern: " + e.message); }
    },
  }, isEditing ? "Änderungen speichern" : "Rezept speichern"));

    } else {
      d.items.push({ ingredient_id: newIng.id, amount: 100, searchText: newIng.name });
    }
  }));
  return overlay;
}

  const d = state.newIngredientDraft;

  const sheet = el("div", { class: "modal-sheet", onclick: (e) => e.stopPropagation() });

  CATEGORY_ORDER.forEach((cat) => {
    catRow.appendChild(el("button", {
      type: "button", class: "pill" + (d.category === cat ? " active" : ""),
      onclick: () => { d.category = cat; render(); },
    }, cat));
  });
  sheet.appendChild(catRow);

  sheet.appendChild(el("div", { class: "field-label" }, "Einheit / typische Packungsgröße"));
  const row2 = el("div", { style: "display:flex; gap:10px;" });
  const unitSelect = el("select", {
    class: "field-input", style: "flex:1;",
    onchange: (e) => (d.unit = e.target.value),
  }, ["g", "ml", "Stück", "EL", "TL"].map((u) => el("option", { value: u, selected: d.unit === u ? "selected" : null }, u)));
  row2.appendChild(unitSelect);
  row2.appendChild(el("input", { class: "field-input", style: "flex:1;", type: "number", placeholder: "z. B. 500", value: d.typical_package_size, oninput: (e) => (d.typical_package_size = e.target.value) }));
  sheet.appendChild(row2);

  const favCheckbox = el("input", { type: "checkbox" });
  favCheckbox.checked = d.is_favorite;
  favCheckbox.addEventListener("change", (e) => (d.is_favorite = e.target.checked));
  favRow.appendChild(favCheckbox);
  favRow.appendChild(document.createTextNode("Als Favorit markieren (immer auf der Einkaufsliste)"));
  sheet.appendChild(favRow);

  sheet.appendChild(el("button", {
    type: "button", class: "btn-primary",
    onclick: async () => {
      if (!d.name.trim()) { alert("Bitte einen Namen eingeben."); return; }
      try {
        const payload = {
          name: d.name.trim(), category: d.category, unit: d.unit,
          typical_package_size: d.typical_package_size ? Number(d.typical_package_size) : null,
          is_favorite: d.is_favorite,
        };
        let resultIng;
        if (isEditing) {
          const updated = await sb(`ingredients?id=eq.${state.editingIngredientId}`, { method: "PATCH", body: payload });
          resultIng = updated[0];
          const idx = state.ingredients.findIndex((i) => i.id === resultIng.id);
          if (idx !== -1) state.ingredients[idx] = resultIng;
        } else {
          const created = await sb("ingredients", { method: "POST", body: { household_id: HOUSEHOLD_ID, ...payload } });
          resultIng = created[0];
          state.ingredients.push(resultIng);
        }
        state.ingredients.sort((a, b) => a.name.localeCompare(b.name));
        state.newIngredientDraft = null;
        state.showAddIngredient = false;
        state.editingIngredientId = null;
        if (onCreated) onCreated(resultIng);
        render();
      } catch (e) { alert("Fehler beim Speichern: " + e.message); }
    },
  }, isEditing ? "Änderungen speichern" : "Zutat speichern"));

  overlay.appendChild(sheet);
  return overlay;
}

async function toggleDayForRecipe(recipeId, day) {
  const existing = state.weekEntries.find((e) => e.day === day);
  try {
    if (existing && existing.recipe_id === recipeId) {
      await sb(`week_plan_entries?id=eq.${existing.id}`, { method: "DELETE" });
      state.weekEntries = state.weekEntries.filter((e) => e.id !== existing.id);
    } else if (existing) {
      await sb(`week_plan_entries?id=eq.${existing.id}`, { method: "PATCH", body: { recipe_id: recipeId } });
      existing.recipe_id = recipeId;
    } else {
      const created = await sb("week_plan_entries", { method: "POST", body: { week_plan_id: state.weekPlanId, day, recipe_id: recipeId } });
      state.weekEntries.push(created[0]);
    }
  } catch (e) { alert("Fehler: " + e.message); }
  render();
}

// ============ Kochmodus ============
let wakeLockSentinel = null;
let cookTimerInterval = null;

async function startCookMode(recipe) {
  state.cookMode = { recipeId: recipe.id, stepIndex: 0 };
  render();
  try {
    if ("wakeLock" in navigator) wakeLockSentinel = await navigator.wakeLock.request("screen");
  } catch (e) { console.warn("Wake Lock nicht verfügbar:", e); }
}
function exitCookMode() {
  state.cookMode = null;
  stopCookTimer();
  if (wakeLockSentinel) { wakeLockSentinel.release().catch(() => {}); wakeLockSentinel = null; }
  render();
}
function cookStep(delta, stepsLength) {
  const next = state.cookMode.stepIndex + delta;
  if (next < 0 || next >= stepsLength) return;
  state.cookMode.stepIndex = next;
  stopCookTimer();
  render();
}
function startCookTimer(minutes, label) {
  stopCookTimer();
  state.cookTimerSecondsLeft = minutes * 60;
  state.cookTimerTotalSeconds = minutes * 60;
  state.cookTimerRunning = true;
  state.cookTimerLabel = label;
  render();
  cookTimerInterval = setInterval(() => {
    state.cookTimerSecondsLeft--;
    if (state.cookTimerSecondsLeft <= 0) {
      stopCookTimer();
      if (navigator.vibrate) navigator.vibrate([300, 100, 300, 100, 300]);
      alert("⏰ Timer abgelaufen: " + label);
      return;
    }
    render();
  }, 1000);
}
function stopCookTimer() {
  if (cookTimerInterval) clearInterval(cookTimerInterval);
  cookTimerInterval = null;
  state.cookTimerRunning = false;
  state.cookTimerSecondsLeft = null;
  render();
}
function formatTimerDisplay(sec) {
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return `${m}:${String(s).padStart(2, "0")}`;
}

function CookModeView() {
  const recipe = state.recipes.find((r) => r.id === state.cookMode.recipeId);
  if (!recipe) { state.cookMode = null; return el("div"); }
  const steps = (recipe.instructions || "").split(/\n+/).map((s) => s.replace(/^\s*\d+[\.\)]\s*/, "").trim()).filter(Boolean);
  if (!steps.length) steps.push("Keine Zubereitungsschritte hinterlegt.");
  const idx = Math.min(state.cookMode.stepIndex, steps.length - 1);
  const stepText = steps[idx];
  const minutes = parseMinutesFromText(stepText);

  // Zaehlen, in wie vielen Schritten jede Zutat insgesamt vorkommt -- wird eine Zutat auf
  // mehrere Schritte aufgeteilt (z.B. Zucker im Teig UND im Belag), zeigen wir keine
  // (potenziell falsche) Gesamtmenge mehr an, sondern nur den Namen als Erinnerung.
  const mentionCounts = {};
  recipe.ingredientRows.forEach((ing) => {
    if (!ing.name) return;
    mentionCounts[ing.ingredient_id] = steps.filter((s) => textMentionsIngredient(s.toLowerCase(), ing.name.toLowerCase())).length;
  });

  const wrap = el("div", { style: "position:fixed; inset:0; background:var(--bg); color:var(--ink); display:flex; flex-direction:column; z-index:60; touch-action:pan-y;" });

  let swipeStartX = null, swipeStartY = null;
  wrap.addEventListener("touchstart", (e) => {
    const t = e.touches[0];
    swipeStartX = t.clientX; swipeStartY = t.clientY;
  }, { passive: true });
  wrap.addEventListener("touchend", (e) => {
    if (swipeStartX === null) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - swipeStartX;
    const dy = t.clientY - swipeStartY;
    swipeStartX = null;
    if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.4) {
      if (dx < 0) cookStep(1, steps.length);
      else cookStep(-1, steps.length);
    }
  }, { passive: true });

  const header = el("div", { style: "display:flex; align-items:center; justify-content:space-between; padding:16px 20px 4px;" });
  header.appendChild(el("button", { type: "button", class: "icon-btn", style: "background:var(--bg-subtle); border-radius:999px; width:34px; height:34px; align-items:center; justify-content:center;", onclick: exitCookMode }, icon("x")));
  header.appendChild(el("div", { style: "font-size:12.5px; color:var(--ink-muted); font-weight:600;" }, recipe.title));
  header.appendChild(el("div", { style: "width:34px;" }));
  wrap.appendChild(header);

  const dotsRow = el("div", { style: "display:flex; gap:6px; justify-content:center; padding:14px 20px 6px;" });
  steps.forEach((_, i) => dotsRow.appendChild(el("div", {
    style: `width:${i === idx ? "18px" : "6px"}; height:6px; border-radius:3px; background:${i <= idx ? "var(--accent)" : "var(--line)"}; transition:width 0.2s ease;`,
  })));
  wrap.appendChild(dotsRow);
  wrap.appendChild(el("div", { style: "text-align:center; font-size:12px; color:var(--ink-muted); font-weight:600; margin-bottom:6px;" }, `Schritt ${idx + 1} von ${steps.length}`));

  const scrollArea = el("div", { style: "flex:1; overflow-y:auto; padding:8px 20px 20px; display:flex; flex-direction:column; gap:14px;" });

  const stepLower = stepText.toLowerCase();
  const matchedIngredients = recipe.ingredientRows.filter((ing) => ing.name && textMentionsIngredient(stepLower, ing.name.toLowerCase()));
  if (matchedIngredients.length) {
    const ingRow = el("div", { style: "display:flex; gap:7px; flex-wrap:wrap;" });
    matchedIngredients.forEach((ing) => {
      const inline = extractInlineAmount(stepText, ing.name);
      let label = ing.name;
      if (inline) label += " · " + inline.amount + (inline.unit ? " " + inline.unit : "");
      else if (mentionCounts[ing.ingredient_id] <= 1) label += " · " + ing.amount + " " + ing.unit;
      ingRow.appendChild(el("div", {
        style: "background:var(--accent-soft); color:var(--accent); border-radius:999px; padding:7px 13px; font-size:12.5px; font-weight:600;",
      }, label));
    });
    scrollArea.appendChild(ingRow);
  }

  const stepCard = el("div", { style: "background:var(--bg-subtle); border-radius:20px; padding:22px; flex-shrink:0;" });
  stepCard.appendChild(el("div", { style: "font-size:19px; line-height:1.55; font-weight:600; color:var(--ink);" }, stepText));
  if (steps.length > 1) stepCard.appendChild(el("div", { style: "font-size:11px; color:var(--ink-muted); margin-top:14px; display:flex; align-items:center; gap:5px;" }, [icon("chevronRight"), el("span", {}, "Zum Wechseln wischen")]));
  scrollArea.appendChild(stepCard);

  if (state.cookTimerRunning) {
    const pct = Math.max(0, Math.min(100, (state.cookTimerSecondsLeft / state.cookTimerTotalSeconds) * 100));
    const ringWrap = el("div", { style: "display:flex; flex-direction:column; align-items:center; gap:10px; padding:8px 0;" });
    const ring = el("div", {
      style: `width:132px; height:132px; border-radius:50%; background:conic-gradient(var(--accent) ${pct}%, var(--line) ${pct}% 100%); display:flex; align-items:center; justify-content:center;`,
    });
    const ringInner = el("div", { style: "width:112px; height:112px; border-radius:50%; background:var(--bg); display:flex; flex-direction:column; align-items:center; justify-content:center;" }, [
      el("div", { style: "font-size:26px; font-weight:700; font-variant-numeric:tabular-nums;" }, formatTimerDisplay(state.cookTimerSecondsLeft)),
      el("div", { style: "font-size:10px; color:var(--ink-muted); margin-top:2px;" }, "verbleibend"),
    ]);
    ring.appendChild(ringInner);
    ringWrap.appendChild(ring);
    ringWrap.appendChild(el("button", { type: "button", style: "background:none; border:none; color:var(--ink-muted); font-size:13px; font-weight:600; text-decoration:underline;", onclick: stopCookTimer }, "Timer stoppen"));
    scrollArea.appendChild(ringWrap);
  } else if (minutes) {
    scrollArea.appendChild(el("button", {
      type: "button",
      style: "display:flex; align-items:center; justify-content:center; gap:8px; background:var(--accent-soft); color:var(--accent); border:none; border-radius:14px; padding:13px 0; font-size:14px; font-weight:600;",
      onclick: () => startCookTimer(minutes, stepText),
    }, [icon("timer"), el("span", {}, `Timer starten (${minutes} Min.)`)]));
  }

  if (idx < steps.length - 1) {
    scrollArea.appendChild(el("div", { style: "font-size:12px; color:var(--ink-muted); padding-top:4px;" }, [
      el("span", { style: "font-weight:700;" }, "Als Nächstes: "),
      el("span", { style: "overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:inline-block; max-width:100%; vertical-align:bottom;" }, steps[idx + 1]),
    ]));
  }

  wrap.appendChild(scrollArea);

  const navRow = el("div", { style: "display:flex; gap:10px; padding:12px 20px max(16px, env(safe-area-inset-bottom)) 20px; border-top:1px solid var(--line);" });
  navRow.appendChild(el("button", {
    type: "button", class: "btn-secondary", style: `flex:1; margin:0; opacity:${idx === 0 ? "0.4" : "1"};`,
    onclick: () => cookStep(-1, steps.length),
  }, "Zurück"));
  if (idx === steps.length - 1) {
    navRow.appendChild(el("button", {
      type: "button", class: "btn-primary", style: "flex:2; margin:0;",
      onclick: exitCookMode,
    }, "Fertig! 🎉"));
  } else {
    navRow.appendChild(el("button", {
      type: "button", class: "btn-primary", style: "flex:2; margin:0; display:flex; align-items:center; justify-content:center; gap:6px;",
      onclick: () => cookStep(1, steps.length),
    }, [el("span", {}, "Weiter"), icon("chevronRight")]));
  }
  wrap.appendChild(navRow);

  return wrap;
}

function computeStats() {
  let mostCooked = null;
  state.recipes.forEach((r) => { if ((r.times_cooked || 0) > 0 && (!mostCooked || r.times_cooked > mostCooked.times_cooked)) mostCooked = r; });
  let longestAgo = null;
  state.recipes.forEach((r) => { if (r.last_cooked_at && (!longestAgo || new Date(r.last_cooked_at) < new Date(longestAgo.last_cooked_at))) longestAgo = r; });
  const weekCount = state.recipes.filter((r) => r.last_cooked_at && (Date.now() - new Date(r.last_cooked_at).getTime()) < 7 * 86400000).length;
  return { mostCooked, longestAgo, weekCount };
}

function isCookedToday(recipe) {
  if (!recipe.last_cooked_at) return false;
  const days = Math.floor((Date.now() - new Date(recipe.last_cooked_at).getTime()) / 86400000);
  return days <= 0;
}

async function planWeekAutomatically() {
  const emptyDays = DAYS.filter((d) => !state.weekEntries.find((e) => e.day === d));
  if (!emptyDays.length) return;
  if (!state.recipes.length) { alert("Noch keine Rezepte vorhanden."); return; }

  state.planningWeek = true; render();
  try {
    // Kandidaten nach "am laengsten nicht gekocht" sortieren (nie gekocht = ganz vorne)
    const pool = [...state.recipes].sort((a, b) => {
      const ta = a.last_cooked_at ? new Date(a.last_cooked_at).getTime() : 0;
      const tb = b.last_cooked_at ? new Date(b.last_cooked_at).getTime() : 0;
      return ta - tb;
    });
    const usedThisRun = new Set();
    const usageMap = {};
    state.weekEntries.forEach((e) => {
      const r = state.recipes.find((x) => x.id === e.recipe_id);
      if (r) r.ingredientRows.forEach((ing) => { usageMap[ing.ingredient_id] = (usageMap[ing.ingredient_id] || 0) + Number(ing.amount); });
    });

    for (const day of emptyDays) {
      let candidates = pool.filter((r) => !usedThisRun.has(r.id));
      if (!candidates.length) candidates = pool;
      // Unter den 3 am laengsten nicht gekochten dasjenige waehlen, das am meisten Zutaten
      // mit der bereits geplanten Woche teilt (weniger Einkaufsvielfalt)
      const topCandidates = candidates.slice(0, Math.min(3, candidates.length));
      let best = topCandidates[0];
      let bestScore = -1;
      for (const cand of topCandidates) {
        let score = 0;
        cand.ingredientRows.forEach((ing) => { if (usageMap[ing.ingredient_id]) score++; });
        if (score > bestScore) { bestScore = score; best = cand; }
      }
      const created = await sb("week_plan_entries", { method: "POST", body: { week_plan_id: state.weekPlanId, day, recipe_id: best.id } });
      state.weekEntries.push(created[0]);
      usedThisRun.add(best.id);
      best.ingredientRows.forEach((ing) => { usageMap[ing.ingredient_id] = (usageMap[ing.ingredient_id] || 0) + Number(ing.amount); });
    }
  } catch (e) { alert("Fehler beim automatischen Planen: " + e.message); }
  state.planningWeek = false; render();
}

function overlapHint(recipe) {
  const usage = {};
  state.weekEntries.forEach((e) => {
    const r = state.recipes.find((x) => x.id === e.recipe_id);
    if (!r) return;
    r.ingredientRows.forEach((ing) => { usage[ing.ingredient_id] = (usage[ing.ingredient_id] || 0) + Number(ing.amount); });
  });
  for (const ing of recipe.ingredientRows) {
    const already = usage[ing.ingredient_id] || 0;
    const stammdaten = state.ingredients.find((i) => i.id === ing.ingredient_id);
    if (!already && stammdaten && stammdaten.typical_package_size && Number(ing.amount) < stammdaten.typical_package_size * 0.85) {
      const candidate = state.recipes.find((r2) => r2.id !== recipe.id && r2.ingredientRows.some((i2) => i2.ingredient_id === ing.ingredient_id));
      if (candidate) return ing.name + " reicht für mehr — z. B. auch „" + candidate.title + "“";
    }
  }
  return null;
}

function computeGeneratedItems() {
  const map = {};
  const skippedFromPantry = [];
  state.weekEntries.forEach((e) => {
    const r = state.recipes.find((x) => x.id === e.recipe_id);
    if (!r) return;
    const baseServings = r.servings || 4;
    const targetServings = e.servings_override || baseServings;
    const factor = targetServings / baseServings;
    r.ingredientRows.forEach((ing) => {
      if (state.pantryIngredientIds.has(ing.ingredient_id)) {
        if (!skippedFromPantry.includes(ing.name)) skippedFromPantry.push(ing.name);
        return;
      }
      if (!map[ing.ingredient_id]) map[ing.ingredient_id] = { amount: 0, name: ing.name, unit: ing.unit, category: ing.category };
      map[ing.ingredient_id].amount += Number(ing.amount) * factor;
    });
  });
  Object.values(map).forEach((item) => { item.amount = Math.round(item.amount * 10) / 10; });
  state.ingredients.forEach((ing) => {
    if (ing.is_favorite && !map[ing.id]) map[ing.id] = { amount: null, name: ing.name, unit: ing.unit, category: ing.category, favorite: true };
  });
  return { map, skippedFromPantry };
}

function startVoiceInput() {
  const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognitionCtor) {
    alert("Spracheingabe wird auf diesem Gerät/Browser leider nicht unterstützt. Auf dem iPhone hilft es manchmal, die Seite direkt in Safari statt der installierten App zu öffnen.");
    return;
  }
  const recognition = new SpeechRecognitionCtor();
  recognition.lang = "de-DE";
  recognition.continuous = false;
  recognition.interimResults = false;

  recognition.onstart = () => { state.voiceListening = true; render(); };
  recognition.onend = () => { state.voiceListening = false; render(); };
  recognition.onerror = (e) => {
    state.voiceListening = false; render();
    if (e.error === "not-allowed" || e.error === "service-not-allowed") alert("Zugriff aufs Mikrofon wurde nicht erlaubt. Bitte in den Geräte-Einstellungen für den Browser freigeben.");
    else if (e.error !== "no-speech" && e.error !== "aborted") alert("Spracheingabe-Fehler: " + e.error);
  };
  recognition.onresult = (e) => {
    const transcript = e.results[0][0].transcript;
    // Bei "Zwiebeln und Tomaten und Käse" o.ä. in einzelne Eintraege auftrennen
    const parts = transcript.split(/,| und /i).map((s) => s.trim()).filter(Boolean);
    parts.forEach((part) => addManualItem(part.charAt(0).toUpperCase() + part.slice(1)));
  };

  try { recognition.start(); } catch (e) { state.voiceListening = false; }
}

async function persistStoreOrder(store) {

  catch (e) { alert("Fehler beim Speichern der Reihenfolge: " + e.message); }

function moveCategory(store, index, direction) {
  const newIndex = index + direction;
  if (newIndex < 0 || newIndex >= store.category_order.length) return;
  const arr = store.category_order;
  [arr[index], arr[newIndex]] = [arr[newIndex], arr[index]];
  render();
  persistStoreOrder(store);
}

      const row = el("div", { class: "list-item" });
      row.appendChild(el("button", {
        type: "button", class: "icon-btn", style: "color:" + (ing.is_favorite ? "var(--accent)" : "var(--ink-muted)") + ";",
        title: ing.is_favorite ? "Favorit entfernen" : "Als Favorit markieren",
        onclick: async () => {
          const newVal = !ing.is_favorite;
          try {
            await sb(`ingredients?id=eq.${ing.id}`, { method: "PATCH", body: { is_favorite: newVal } });
            ing.is_favorite = newVal;
            render();
          } catch (e) { alert("Fehler: " + e.message); }
        },
      }, el("span", { html: ing.is_favorite ? "★" : "☆", style: "font-size:17px; line-height:1;" })));
      row.appendChild(el("button", {
        type: "button", class: "icon-btn",
        style: "color:" + (state.pantryIngredientIds.has(ing.id) ? "var(--accent)" : "var(--ink-muted)") + "; background:" + (state.pantryIngredientIds.has(ing.id) ? "var(--accent-soft)" : "transparent") + "; border-radius:8px;",
        title: state.pantryIngredientIds.has(ing.id) ? "Aus Vorrat entfernen" : "Auf Vorrat markieren (wird von der Einkaufsliste weggelassen)",
        onclick: async () => {
          const inPantry = state.pantryIngredientIds.has(ing.id);
          try {
            if (inPantry) {
              await sb(`pantry_items?household_id=eq.${HOUSEHOLD_ID}&ingredient_id=eq.${ing.id}`, { method: "DELETE" });
              state.pantryIngredientIds.delete(ing.id);
            } else {
              await sb("pantry_items", { method: "POST", body: { household_id: HOUSEHOLD_ID, ingredient_id: ing.id } });
              state.pantryIngredientIds.add(ing.id);
            }
            render();
          } catch (e) { alert("Fehler: " + e.message); }
        },
      }, icon("pantry")));
      const label = el("div", { style: "flex:1; font-size:14px; cursor:pointer;" });
      label.appendChild(document.createTextNode(ing.name));
      label.addEventListener("click", () => {
        state.editingIngredientId = ing.id;
        state.newIngredientDraft = { name: ing.name, category: ing.category, unit: ing.unit, typical_package_size: ing.typical_package_size || "", is_favorite: ing.is_favorite };
        state.showAddIngredient = true;
        render();
      });
      row.appendChild(label);
      row.appendChild(el("span", { style: "font-size:12.5px; color:var(--ink-soft);" }, (ing.typical_package_size ? ing.typical_package_size + " " + ing.unit : ing.unit)));
      row.appendChild(el("button", { type: "button", class: "icon-btn", onclick: () => deleteIngredient(ing) }, icon("trash")));
      card.appendChild(row);
    });
    wrap.appendChild(card);
  });

  return wrap;
}

// ============ App Shell ============
function renderTabOnly() { render(); } // einfache Variante: komplettes Neu-Rendern

function App() {
  if (!state.session) return AuthScreen();
  if (state.loading) return el("div", {}, el("div", { class: "spinner" }));
  if (state.cookMode) return CookModeView();

  const container = el("div");
  const openRecipe = state.openRecipeId ? state.recipes.find((r) => r.id === state.openRecipeId) : null;

  if (openRecipe) {
    container.appendChild(RecipeDetail(openRecipe));
  } else {
    if (state.tab === "recipes") container.appendChild(RecipesTab());
    if (state.tab === "plan") container.appendChild(WeekPlanTab());
    if (state.tab === "list") container.appendChild(ShoppingListTab());
    if (state.tab === "stores") container.appendChild(StoresTab());
    if (state.tab === "ingredients") container.appendChild(IngredientsTab());

    const nav = el("div", { class: "bottom-nav" });
    [["recipes", "book", "Rezepte"], ["plan", "calendar", "Wochenplan"], ["list", "basket", "Einkauf"], ["ingredients", "leaf", "Zutaten"], ["stores", "store", "Läden"]].forEach(([key, ic, label]) => {
      nav.appendChild(el("button", { class: "nav-btn" + (state.tab === key ? " active" : ""), onclick: () => { state.tab = key; render(); } }, [icon(ic), el("span", {}, label)]));
    });
    container.appendChild(nav);
  }

  if (state.showAddRecipe) container.appendChild(AddRecipeModal());
  if (state.showImportRecipe) container.appendChild(ImportRecipeModal());
  if (state.showAddIngredient && !state.showAddRecipe) container.appendChild(AddIngredientModal(null));
  if (state.showDayPicker) container.appendChild(DayPickerModal(state.showDayPicker));
  if (state.showWeekPicker) container.appendChild(WeekPickerModal(state.showWeekPicker));
  if (state.confirmDialog) container.appendChild(ConfirmModal());

  return container;
}

render();

state.pendingSharedUrl = extractSharedUrl();
if (state.pendingSharedUrl && state.session) processSharedUrlIfAny();

setInterval(() => {
  if (state.session && state.session.refresh_token) refreshSession().catch(() => {});
}, 45 * 60 * 1000);

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/sw.js").catch((e) => console.warn("Service Worker Registrierung fehlgeschlagen:", e));
  });
}
</script>
